name: Update Weather

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch weather from NWS and push to Firebase
        run: |
          python3 - <<'SCRIPT'
          import json, urllib.request

          FB_URL = "https://family-trip---june-2026-default-rtdb.firebaseio.com/trips/denver/weather"

          # NWS forecast endpoints
          # Denver: BOU office, grid 62,60
          # Colorado Springs: PUB office, grid 90,91
          DENVER_URL = "https://api.weather.gov/gridpoints/BOU/62,60/forecast"
          SPRINGS_URL = "https://api.weather.gov/gridpoints/PUB/90,91/forecast"

          headers = {"User-Agent": "family-trip-app (github-action)"}

          def fetch_nws(url):
              req = urllib.request.Request(url, headers=headers)
              resp = urllib.request.urlopen(req)
              data = json.loads(resp.read())
              return data.get('properties', {}).get('periods', [])

          def desc_to_icon(desc):
              d = desc.lower()
              if 'thunderstorm' in d and ('likely' in d or 'showers and thunder' in d): return "⛈️"
              if 'thunderstorm' in d or 'shower' in d: return "🌦️"
              if 'rain' in d: return "🌧️"
              if 'cloudy' in d and 'partly' in d: return "🌤️"
              if 'cloudy' in d and 'mostly' in d: return "⛅"
              if 'cloudy' in d: return "⛅"
              if 'sunny' in d and 'mostly' in d: return "🌤️"
              if 'sunny' in d: return "☀️"
              if 'clear' in d: return "☀️"
              return "🌤️"

          # Trip date range
          trip_dates = ['7-29', '7-30', '7-31', '8-1', '8-2', '8-3', '8-4', '8-5']
          multi_city_days = ['8-2', '8-4']

          # NWS returns periods alternating day/night
          # Parse into {date_key: {hi, lo, icon}}
          def parse_forecast(periods):
              forecast = {}
              for p in periods:
                  if not p.get('isDaytime', False):
                      continue
                  # Extract month/day from startTime (e.g. "2026-07-31T06:00:00-06:00")
                  date_str = p['startTime'][:10]
                  parts = date_str.split('-')
                  key = f"{int(parts[1])}-{int(parts[2])}"
                  if key not in trip_dates:
                      continue
                  hi = p['temperature']
                  icon = desc_to_icon(p['shortForecast'])
                  forecast[key] = {'hi': hi, 'icon': icon, 'desc': p['shortForecast']}
              # Get lows from nighttime periods
              for p in periods:
                  if p.get('isDaytime', True):
                      continue
                  date_str = p['startTime'][:10]
                  parts = date_str.split('-')
                  key = f"{int(parts[1])}-{int(parts[2])}"
                  if key in forecast:
                      forecast[key]['lo'] = p['temperature']
              return forecast

          try:
              denver_periods = fetch_nws(DENVER_URL)
              denver_fc = parse_forecast(denver_periods)
          except Exception as e:
              print(f"Failed to fetch Denver: {e}")
              denver_fc = {}

          try:
              springs_periods = fetch_nws(SPRINGS_URL)
              springs_fc = parse_forecast(springs_periods)
          except Exception as e:
              print(f"Failed to fetch CO Springs: {e}")
              springs_fc = {}

          if not denver_fc:
              print("No Denver data — skipping update")
              exit(0)

          # Build weather object
          # First, get existing data to preserve past days
          try:
              existing_req = urllib.request.Request(f"{FB_URL}.json", headers=headers)
              existing_resp = urllib.request.urlopen(existing_req)
              weather = json.loads(existing_resp.read()) or {}
          except:
              weather = {}

          # Update with fresh NWS data
          for key, d in denver_fc.items():
              lo = d.get('lo', 60)
              if key in multi_city_days and key in springs_fc:
                  s = springs_fc[key]
                  s_lo = s.get('lo', 55)
                  weather[key] = [
                      {"hi": d['hi'], "lo": lo, "icon": d['icon'], "loc": "Denver"},
                      {"hi": s['hi'], "lo": s_lo, "icon": s['icon'], "loc": "CO Springs"}
                  ]
              else:
                  weather[key] = {"hi": d['hi'], "lo": lo, "icon": d['icon'], "loc": "Denver"}

          # Push to Firebase
          data = json.dumps(weather).encode()
          req = urllib.request.Request(
              f"{FB_URL}.json",
              data=data,
              headers={'Content-Type': 'application/json'},
              method='PUT'
          )
          urllib.request.urlopen(req)
          print("✓ Weather updated from NWS")
          for k, v in sorted(weather.items()):
              print(f"  {k}: {v}")
          SCRIPT
