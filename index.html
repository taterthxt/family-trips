<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Trips">
<meta name="theme-color" content="#0d1117">
<title>Family Trips — 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: #0d1117; color: #c9d1d9; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; overflow-x: hidden;
}

.page-header {
  text-align: center; margin-bottom: 40px;
}
.page-header h1 {
  font-size: 28px; font-weight: 700; color: #e8ecf0;
  margin-bottom: 6px;
}
.page-header .subtitle {
  font-size: 13px; color: #8b949e;
}

.trip-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px; width: 100%; max-width: 700px;
}

.trip-card {
  background: #161b22; border: 1px solid #30363d; border-radius: 12px;
  padding: 28px 24px; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  position: relative; overflow: hidden;
}
.trip-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}
.trip-card.denver:hover { border-color: #58a6ff; }
.trip-card.nashville:hover { border-color: #ff69b4; }

.trip-card .card-icon {
  font-size: 42px; margin-bottom: 14px;
}
.trip-card .card-title {
  font-size: 20px; font-weight: 700; margin-bottom: 6px;
}
.trip-card.denver .card-title { color: #58a6ff; }
.trip-card.nashville .card-title { color: #ff69b4; }

.trip-card .card-dates {
  font-size: 13px; color: #8b949e; margin-bottom: 10px;
}
.trip-card .card-people {
  font-size: 11px; color: #6e7681;
}
.trip-card .card-status {
  position: absolute; top: 16px; right: 16px;
  font-size: 10px; font-weight: 700; padding: 3px 8px;
  border-radius: 10px;
}
.trip-card.denver .card-status {
  background: #0d1f30; color: #58a6ff; border: 1px solid #1f3a5f;
}
.trip-card.nashville .card-status {
  background: #1a0a14; color: #ff69b4; border: 1px solid #3d1a2a;
}

/* Progress mini-bar */
.card-progress {
  margin-top: 14px; height: 6px; background: #21262d;
  border-radius: 3px; overflow: hidden;
}
.card-progress-fill {
  height: 100%; border-radius: 3px; transition: width 0.5s;
}
.trip-card.denver .card-progress-fill { background: linear-gradient(90deg, #58a6ff, #1f6feb); }
.trip-card.nashville .card-progress-fill { background: linear-gradient(90deg, #ff69b4, #ff1493); }

/* Decorative gradient orb */
.trip-card::before {
  content: ''; position: absolute; width: 200px; height: 200px;
  border-radius: 50%; filter: blur(80px); opacity: 0.08;
  top: -60px; right: -60px;
}
.trip-card.denver::before { background: #58a6ff; }
.trip-card.nashville::before { background: #ff69b4; }

/* Flying planes background */
.planes-container {
  position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0;
}
.plane {
  position: absolute; font-size: 20px; opacity: 0.08;
  animation: fly linear infinite;
}
@keyframes fly {
  0% { transform: translateX(-50px) translateY(0); }
  100% { transform: translateX(calc(100vw + 50px)) translateY(-80px); }
}
@keyframes fly-reverse {
  0% { transform: translateX(calc(100vw + 50px)) translateY(0) scaleX(-1); }
  100% { transform: translateX(-50px) translateY(-80px) scaleX(-1); }
}

.page-header, .trip-grid { position: relative; z-index: 1; }

/* Trip iframe overlay */
.trip-frame-overlay {
  position: fixed; inset: 0; z-index: 500; background: #0d1117;
  display: none; flex-direction: column;
}
.trip-frame-overlay.visible { display: flex; }
.trip-frame-overlay iframe {
  flex: 1; border: none; width: 100%; height: 100%;
}

@media (max-width: 768px) {
  .trip-grid { grid-template-columns: 1fr; max-width: 100%; }
  .page-header h1 { font-size: 22px; }
  .trip-card { padding: 22px 18px; }
  .trip-card .card-icon { font-size: 36px; }
  .trip-card .card-title { font-size: 18px; }
}
</style>
</head>
<body>

<div class="planes-container" id="planes-container"></div>

<div class="page-header">
  <h1>✈️ Family Trips — 2026</h1>
  <div class="subtitle">Select a trip to view the itinerary</div>
</div>

<div class="trip-grid" id="trip-grid"></div>

<!-- Trip iframe overlay -->
<div class="trip-frame-overlay" id="trip-frame-overlay">
  <iframe id="trip-iframe" src="" allow="geolocation"></iframe>
</div>

<script>
const trips = [
  {
    id: 'denver',
    icon: '🏔️',
    title: 'Denver, CO',
    dates: 'Jul 29 – Aug 5, 2026',
    startDate: new Date('2026-07-29T00:00:00'),
    endDate: new Date('2026-08-06T00:00:00'),
    people: 'Christian, Jesse, Kenzie, Ben, Ace, Sofia',
    cssClass: 'denver',
    url: 'denver.html'
  },
  {
    id: 'nashville',
    icon: '☀️',
    title: 'Nashville, TN',
    dates: 'Jun 24 – Jul 5, 2026',
    startDate: new Date('2026-06-24T00:00:00'),
    endDate: new Date('2026-07-06T00:00:00'),
    people: 'Christian, Jesse, Kenzie, Ben, Ace, Sofia',
    cssClass: 'nashville',
    url: 'nashville.html'
  }
];

// Sort by start date descending (most recent/upcoming first)
trips.sort((a, b) => b.startDate - a.startDate);

function getStatus(start, end) {
  const now = new Date();
  if (now < start) {
    const days = Math.ceil((start - now) / 86400000);
    return { label: `${days}d away`, progress: 0 };
  } else if (now >= end) {
    return { label: 'Complete ✓', progress: 100 };
  } else {
    const pct = Math.round((now - start) / (end - start) * 100);
    return { label: `Day ${Math.floor((now - start) / 86400000) + 1}`, progress: pct };
  }
}

const grid = document.getElementById('trip-grid');
trips.forEach(trip => {
  const status = getStatus(trip.startDate, trip.endDate);
  const card = document.createElement('div');
  card.className = `trip-card ${trip.cssClass}`;
  card.innerHTML = `
    <span class="card-status">${status.label}</span>
    <div class="card-icon">${trip.icon}</div>
    <div class="card-title">${trip.title}</div>
    <div class="card-dates">${trip.dates}</div>
    <div class="card-people">${trip.people}</div>
    <div class="card-progress"><div class="card-progress-fill" style="width:${status.progress}%"></div></div>
  `;
  card.addEventListener('click', () => { openTrip(trip.url); });
  grid.appendChild(card);
});

// Trip iframe overlay
const tripOverlay = document.getElementById('trip-frame-overlay');
const tripIframe = document.getElementById('trip-iframe');
function openTrip(url) {
  tripIframe.src = url;
  tripOverlay.classList.add('visible');
}
function closeTrip() {
  tripOverlay.classList.remove('visible');
  tripIframe.src = '';
}
// Listen for back button clicks from inside the iframe
window.addEventListener('message', e => { if (e.data === 'close-trip') closeTrip(); });
// Spawn flying planes in background
const planesContainer = document.getElementById('planes-container');
function spawnPlane() {
  const plane = document.createElement('div');
  plane.className = 'plane';
  plane.textContent = '✈';
  const y = Math.random() * 100;
  const size = 14 + Math.random() * 18;
  const isMobile = window.innerWidth <= 768;
  const duration = isMobile ? (5 + Math.random() * 8) : (12 + Math.random() * 20);
  const delay = Math.random() * -20;
  const reverse = Math.random() > 0.5;
  plane.style.top = y + '%';
  plane.style.fontSize = size + 'px';
  plane.style.animationDuration = duration + 's';
  plane.style.animationDelay = delay + 's';
  plane.style.animationName = reverse ? 'fly-reverse' : 'fly';
  plane.style.opacity = 0.04 + Math.random() * 0.06;
  planesContainer.appendChild(plane);
}
for (let i = 0; i < 20; i++) spawnPlane();
</script>
</body>
</html>
