<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="✈️ Family Trips">
<meta name="theme-color" content="#0d1117">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%230d1117' width='180' height='180' rx='40'/><text y='90' x='90' font-size='100' text-anchor='middle' dominant-baseline='central' font-family='Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji'>✈</text></svg>">
<title>Family Trips — 2026</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: #0d1117; color: #c9d1d9; min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px; overflow-x: hidden;
}

.page-header {
  text-align: center; margin-bottom: 40px;
}
.page-header h1 {
  font-size: 28px; font-weight: 700; color: #e8ecf0;
  margin-bottom: 6px;
}
.page-header .subtitle {
  font-size: 13px; color: #8b949e;
}

.trip-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px; width: 100%; max-width: 700px;
}

.trip-card {
  background: #161b22; border: 1px solid #30363d; border-radius: 12px;
  padding: 28px 24px; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  position: relative; overflow: hidden;
}
.trip-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}
.trip-card.denver:hover { border-color: #58a6ff; }
.trip-card.nashville:hover { border-color: #ff69b4; }

.trip-card .card-icon {
  font-size: 42px; margin-bottom: 14px;
}
.trip-card .card-title {
  font-size: 20px; font-weight: 700; margin-bottom: 6px;
}
.trip-card.denver .card-title { color: #58a6ff; }
.trip-card.nashville .card-title { color: #ff69b4; }

.trip-card .card-dates {
  font-size: 13px; color: #8b949e; margin-bottom: 10px;
}
.trip-card .card-people {
  font-size: 11px; color: #6e7681;
}
.trip-card .card-status {
  position: absolute; top: 16px; right: 16px;
  font-size: 10px; font-weight: 700; padding: 3px 8px;
  border-radius: 10px;
}
.trip-card.denver .card-status {
  background: #0d1f30; color: #58a6ff; border: 1px solid #1f3a5f;
}
.trip-card.nashville .card-status {
  background: #1a0a14; color: #ff69b4; border: 1px solid #3d1a2a;
}

/* Progress mini-bar */
.card-progress {
  margin-top: 14px; height: 6px; background: #21262d;
  border-radius: 3px; overflow: hidden;
}
.card-progress-fill {
  height: 100%; border-radius: 3px; transition: width 0.5s;
}
.trip-card.denver .card-progress-fill { background: linear-gradient(90deg, #58a6ff, #1f6feb); }
.trip-card.nashville .card-progress-fill { background: linear-gradient(90deg, #ff69b4, #ff1493); }

/* Decorative gradient orb */
.trip-card::before {
  content: ''; position: absolute; width: 200px; height: 200px;
  border-radius: 50%; filter: blur(80px); opacity: 0.08;
  top: -60px; right: -60px;
}
.trip-card.denver::before { background: #58a6ff; }
.trip-card.nashville::before { background: #ff69b4; }

@media (max-width: 768px) {
  .trip-grid { grid-template-columns: 1fr; max-width: 100%; }
  .page-header h1 { font-size: 22px; }
  .trip-card { padding: 22px 18px; }
  .trip-card .card-icon { font-size: 36px; }
  .trip-card .card-title { font-size: 18px; }
}
</style>
</head>
<body>

<div class="page-header">
  <h1>✈️ Family Trips — 2026</h1>
  <div class="subtitle">Select a trip to view the itinerary</div>
</div>

<div class="trip-grid" id="trip-grid"></div>

<script>
const trips = [
  {
    id: 'denver',
    icon: '🏔️',
    title: 'Denver, CO',
    dates: 'Jul 29 – Aug 5, 2026',
    startDate: new Date('2026-07-29'),
    endDate: new Date('2026-08-06'),
    people: 'Christian, Jesse, Kenzie, Ben, Ace, Sofia',
    cssClass: 'denver',
    url: 'denver.html'
  },
  {
    id: 'nashville',
    icon: '☀️',
    title: 'Nashville, TN',
    dates: 'Jun 24 – Jul 5, 2026',
    startDate: new Date('2026-06-24'),
    endDate: new Date('2026-07-06'),
    people: 'Christian, Jesse, Kenzie, Ben, Ace, Sofia',
    cssClass: 'nashville',
    url: 'nashville.html'
  }
];

// Sort by start date descending (most recent/upcoming first)
trips.sort((a, b) => b.startDate - a.startDate);

function getStatus(start, end) {
  const now = new Date();
  if (now < start) {
    const days = Math.ceil((start - now) / 86400000);
    return { label: `${days}d away`, progress: 0 };
  } else if (now >= end) {
    return { label: 'Complete ✓', progress: 100 };
  } else {
    const pct = Math.round((now - start) / (end - start) * 100);
    return { label: `Day ${Math.floor((now - start) / 86400000) + 1}`, progress: pct };
  }
}

const grid = document.getElementById('trip-grid');
trips.forEach(trip => {
  const status = getStatus(trip.startDate, trip.endDate);
  const card = document.createElement('div');
  card.className = `trip-card ${trip.cssClass}`;
  card.innerHTML = `
    <span class="card-status">${status.label}</span>
    <div class="card-icon">${trip.icon}</div>
    <div class="card-title">${trip.title}</div>
    <div class="card-dates">${trip.dates}</div>
    <div class="card-people">${trip.people}</div>
    <div class="card-progress"><div class="card-progress-fill" style="width:${status.progress}%"></div></div>
  `;
  card.addEventListener('click', () => { window.location.href = trip.url; });
  grid.appendChild(card);
});
</script>
</body>
</html>
